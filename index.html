<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cycle">
<meta name="theme-color" content="#F5F1EA">
<title>Cycle Companion</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #F5F1EA;
    color: #1c1917;
    -webkit-font-smoothing: antialiased;
    transition: background 0.6s ease;
    min-height: 100vh;
    min-height: 100dvh;
  }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .display { font-family: 'Fraunces', serif; font-weight: 500; }
  .italic-display { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; }
  .container { max-width: 480px; margin: 0 auto; padding: 40px 24px 48px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; color: #78716c; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
  .header .label { display: flex; align-items: center; gap: 8px; }
  .icon-btn { background: none; border: none; cursor: pointer; color: #57534e; padding: 6px; display: flex; }
  .icon-btn:hover { color: #1c1917; }

  .day-block { margin-bottom: 32px; }
  .day-row { display: flex; align-items: baseline; gap: 12px; }
  .day-num { font-size: 84px; line-height: 1; font-weight: 500; }
  .day-total { color: #78716c; font-size: 14px; }
  .phase-name { font-size: 32px; margin-top: 12px; color: #1c1917; }
  .phase-sub { color: #57534e; margin-top: 2px; }

  .strip { padding: 14px 16px; border-radius: 8px; background: rgba(0,0,0,0.04); margin-bottom: 24px; }
  .strip .hormones { font-size: 14px; font-weight: 500; color: #292524; margin-top: 4px; }

  section { margin-bottom: 24px; }
  section h2 { margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .expect { line-height: 1.6; color: #292524; }

  .card { padding: 20px; border-radius: 8px; background: rgba(255,255,255,0.55); backdrop-filter: blur(6px); }
  .card-muted { background: rgba(0,0,0,0.04); }
  ul { list-style: none; }
  ul li { display: flex; gap: 12px; line-height: 1.5; margin-bottom: 8px; color: #292524; }
  ul li:last-child { margin-bottom: 0; }
  ul.avoid li { font-size: 14px; color: #44403c; }
  .dash { flex-shrink: 0; }
  .x { color: #a8a29e; flex-shrink: 0; }

  .footer { display: flex; justify-content: space-between; font-size: 12px; color: #78716c; padding-top: 16px; border-top: 1px solid rgba(168,162,158,0.4); }

  .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .settings-header h1 { font-size: 28px; }
  .field { margin-bottom: 24px; }
  .field label { display: block; margin-bottom: 8px; }
  .field input { width: 100%; padding: 12px 16px; background: white; border: 1px solid #d6d3d1; border-radius: 6px; font-family: inherit; font-size: 16px; color: #1c1917; }
  .field input:focus { outline: none; border-color: #1c1917; }
  .field input[type="number"] { width: 100px; }
  .field-row { display: flex; align-items: center; gap: 12px; }
  .field-row span { color: #57534e; }
  .hint { font-size: 12px; color: #78716c; margin-top: 8px; line-height: 1.5; }
  .save-btn { width: 100%; padding: 14px; background: #1c1917; color: white; border: none; border-radius: 6px; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
  .save-btn:hover { background: #292524; }
  .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .footer-note { font-size: 12px; color: #a8a29e; margin-top: 40px; line-height: 1.6; }

  .hidden { display: none; }
  .ico { width: 14px; height: 14px; stroke-width: 2; fill: none; stroke: currentColor; }
  .ico-lg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div id="settings-view" class="container hidden">
  <div class="settings-header">
    <h1 class="display" id="settings-title">Set up</h1>
    <button id="close-settings" class="icon-btn hidden" aria-label="Close">
      <svg class="ico ico-lg" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="field">
    <label class="label" for="start-date">Last period start date</label>
    <input type="date" id="start-date">
    <p class="hint">First day she started bleeding most recently.</p>
  </div>

  <div class="field">
    <label class="label" for="cycle-length">Average cycle length</label>
    <div class="field-row">
      <input type="number" id="cycle-length" min="21" max="40" value="28">
      <span>days</span>
    </div>
    <p class="hint">Default 28. Most cycles are 21–35 days.</p>
  </div>

  <button id="save-btn" class="save-btn" disabled>
    <svg class="ico ico-lg" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
    Save
  </button>

  <p class="footer-note">Stored locally on your device. Update the start date each new cycle for accuracy.</p>
</div>

<div id="main-view" class="container hidden">
  <div class="header">
    <div class="label">
      <svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span id="today-date"></span>
    </div>
    <button id="open-settings" class="icon-btn" aria-label="Settings">
      <svg class="ico ico-lg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div class="day-block">
    <div class="day-row">
      <span class="display day-num" id="day-num"></span>
      <span class="day-total" id="day-total"></span>
    </div>
    <h1 class="display phase-name" id="phase-name"></h1>
    <p class="italic-display phase-sub" id="phase-sub"></p>
  </div>

  <div class="strip">
    <p class="label">Hormones</p>
    <p class="hormones" id="hormones"></p>
  </div>

  <section>
    <h2 class="label">What to expect</h2>
    <p class="expect" id="expect"></p>
  </section>

  <section class="card" id="your-move-card">
    <h2 class="label" id="your-move-title">
      <svg class="ico" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" fill="currentColor"/></svg>
      Your move
    </h2>
    <ul id="your-move-list"></ul>
  </section>

  <section class="card card-muted">
    <h2 class="label">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      Avoid
    </h2>
    <ul class="avoid" id="avoid-list"></ul>
  </section>

  <div class="footer">
    <span id="footer-day"></span>
    <span id="footer-next"></span>
  </div>
</div>

<script>
  const PHASES = () => ({
    menstrual: {
      name: "Menstrual", sub: "Period",
      hormones: "Estrogen LOW · Progesterone LOW",
      expect: "Tired, possibly crampy, low energy, may want to withdraw. Sensitive to stress and cold.",
      yourMove: [
        "Bring comfort: heating pad, tea, her favorite snacks",
        "Take over a chore without being asked",
        "Keep plans low-key — couch + film beats going out",
        "Gentle affection, no pressure for intimacy",
        "Don't problem-solve her discomfort — just be there"
      ],
      avoid: ["Big nights out", "Heavy debates", "Asking 'are you okay?' on repeat"],
      color: "#8B2E2E", bg: "#FBE9E5"
    },
    follicular: {
      name: "Follicular", sub: "Rising energy",
      hormones: "Estrogen RISING · Progesterone low",
      expect: "Optimistic, social, more open to new experiences. Confidence and focus increasing day by day.",
      yourMove: [
        "Plan a date or new experience — she's up for it",
        "Good window for bigger conversations and decisions",
        "Suggest activities (hike, gym, restaurant, weekend trip)",
        "Compliment effort and ideas, not just looks",
        "Match her rising energy"
      ],
      avoid: ["Being a couch potato all week", "Overplanning every minute"],
      color: "#2F6B4F", bg: "#E4F1E8"
    },
    ovulation: {
      name: "Ovulation", sub: "Peak window",
      hormones: "Estrogen PEAK · Testosterone spike · LH surge",
      expect: "Most confident, social, attractive-feeling phase. Libido peaks. She's at her most vibrant.",
      yourMove: [
        "Romantic gesture — flowers, surprise, well-planned date",
        "Tell her she looks beautiful (she'll feel it most now)",
        "Initiate intimacy — libido is at its highest",
        "Social events land well — dinners, parties, gatherings",
        "Big positive conversations (vacations, plans, dreams)"
      ],
      avoid: ["Staying in three nights running", "Being passive — she wants engagement"],
      color: "#B8651C", bg: "#FBEBD8"
    },
    earlyLuteal: {
      name: "Early Luteal", sub: "Settling in",
      hormones: "Progesterone RISING · Estrogen moderate",
      expect: "Calmer, more inward, nesting energy. Less social hunger, more cozy preference.",
      yourMove: [
        "Cozy time wins — cooking together, films, slow mornings",
        "Be a steady, reliable presence",
        "Good time for practical planning (logistics, admin)",
        "Light affection without pressure",
        "Notice and appreciate the small things she does"
      ],
      avoid: ["Forcing big social plans", "Last-minute schedule changes"],
      color: "#5C4A8C", bg: "#ECE7F5"
    },
    lateLuteal: {
      name: "Late Luteal", sub: "PMS window — handle with care",
      hormones: "Estrogen DROP · Progesterone DROP",
      expect: "Irritability, sensitivity, mood swings, bloating, cravings, possibly tearful. Stuff that wouldn't normally bother her, will.",
      yourMove: [
        "Triple your patience — don't take things personally",
        "Validate feelings BEFORE offering solutions ('that sounds hard' first)",
        "Bring chocolate, comfort food, or her go-to snack unprompted",
        "Take initiative on chores and dinner — reduce her load",
        "Physical comfort: cuddles, back rub, warmth",
        "Apologize first even if you think you're right — fight isn't worth it"
      ],
      avoid: [
        "'Calm down' or 'you're overreacting'",
        "Criticism, even constructive",
        "Big serious conversations — they'll go sideways",
        "Pointing out it's PMS (cardinal sin)"
      ],
      color: "#7A2E4E", bg: "#F7E1EA"
    }
  });

  const getPhase = (day, cycleLength) => {
    const p = PHASES();
    const ovulation = cycleLength - 14;
    if (day <= 5) return p.menstrual;
    if (day < ovulation - 1) return p.follicular;
    if (day <= ovulation + 1) return p.ovulation;
    if (day <= ovulation + 7) return p.earlyLuteal;
    return p.lateLuteal;
  };

  const $ = (id) => document.getElementById(id);
  const todayISO = () => new Date().toISOString().slice(0, 10);

  const load = () => {
    const start = localStorage.getItem("cycle:startDate");
    const len = localStorage.getItem("cycle:length");
    return {
      startDate: start ? new Date(start) : null,
      cycleLength: len ? parseInt(len) : 28
    };
  };

  const save = (date, length) => {
    localStorage.setItem("cycle:startDate", date.toISOString());
    localStorage.setItem("cycle:length", String(length));
  };

  const showSettings = (existing) => {
    $("main-view").classList.add("hidden");
    $("settings-view").classList.remove("hidden");
    $("settings-title").textContent = existing ? "Adjust" : "Set up";
    $("close-settings").classList.toggle("hidden", !existing);
    const { startDate, cycleLength } = load();
    $("start-date").value = startDate ? startDate.toISOString().slice(0,10) : todayISO();
    $("cycle-length").value = cycleLength || 28;
    $("start-date").max = todayISO();
    validateForm();
  };

  const validateForm = () => {
    $("save-btn").disabled = !$("start-date").value;
  };

  const render = () => {
    const { startDate, cycleLength } = load();
    if (!startDate) { showSettings(false); return; }

    $("settings-view").classList.add("hidden");
    $("main-view").classList.remove("hidden");

    const today = new Date(); today.setHours(0,0,0,0);
    const start = new Date(startDate); start.setHours(0,0,0,0);
    const elapsed = Math.floor((today - start) / 86400000);
    const dayInCycle = ((elapsed % cycleLength) + cycleLength) % cycleLength + 1;
    const daysUntilNext = cycleLength - dayInCycle + 1;
    const phase = getPhase(dayInCycle, cycleLength);

    document.body.style.background = phase.bg;
    document.querySelector('meta[name="theme-color"]').setAttribute("content", phase.bg);

    $("today-date").textContent = today.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
    $("day-num").textContent = dayInCycle;
    $("day-num").style.color = phase.color;
    $("day-total").textContent = `/ ${cycleLength}`;
    $("phase-name").textContent = phase.name;
    $("phase-sub").textContent = phase.sub;
    $("hormones").textContent = phase.hormones;
    $("expect").textContent = phase.expect;
    $("your-move-title").style.color = phase.color;
    $("your-move-title").querySelector("svg").style.color = phase.color;

    const moveList = $("your-move-list");
    moveList.innerHTML = "";
    phase.yourMove.forEach(item => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="dash" style="color:${phase.color}">—</span><span>${item}</span>`;
      moveList.appendChild(li);
    });

    const avoidList = $("avoid-list");
    avoidList.innerHTML = "";
    phase.avoid.forEach(item => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="x">×</span><span>${item}</span>`;
      avoidList.appendChild(li);
    });

    $("footer-day").textContent = `Day ${dayInCycle} of ${cycleLength}`;
    const next = daysUntilNext === cycleLength ? 0 : daysUntilNext;
    $("footer-next").textContent = `Next period in ${next} day${next === 1 ? "" : "s"}`;
  };

  $("save-btn").addEventListener("click", () => {
    const date = new Date($("start-date").value);
    const length = parseInt($("cycle-length").value) || 28;
    if (!$("start-date").value) return;
    save(date, length);
    render();
  });
  $("start-date").addEventListener("input", validateForm);
  $("open-settings").addEventListener("click", () => showSettings(true));
  $("close-settings").addEventListener("click", () => render());

  render();

  // Service worker registration — required for PWA / APK packaging
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((err) => {
        console.warn('SW registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
